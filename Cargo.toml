# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "atlh"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Compatibility harness for a fork of Android Translation Layer"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rand = "0.8"
rand_chacha = "0.3"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
ureq = "2"

[profile.release]
lto = "thin"
